name: Shorts Üret

on:
  workflow_dispatch:
    inputs:
      senaryo:
        description: "Senaryo dosyasının adı (senaryolar/ klasöründe, ör. ornek; büyük harf ve .json da olur)"
        required: true
        type: string
      ses:
        description: "Seslendiren (Guy = erkek, Jenny = kadın; ikisi de en-US)"
        required: true
        default: Guy
        type: choice
        options:
          - Guy
          - Jenny

# Release oluşturabilmek için yazma izni gerekli
permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg ve yazı tipini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Senaryo dosyasını kontrol et
        env:
          SENARYO: ${{ inputs.senaryo }}
        run: |
          # Baştaki/sondaki boşlukları, "senaryolar/" önekini ve .json
          # uzantısını (.JSON, .Json da) at
          ad="$SENARYO"
          ad="${ad#"${ad%%[![:space:]]*}"}"
          ad="${ad%"${ad##*[![:space:]]}"}"
          ad="${ad#senaryolar/}"
          shopt -s nocasematch
          if [[ "$ad" =~ ^(.*)\.json$ ]]; then ad="${BASH_REMATCH[1]}"; fi
          shopt -u nocasematch
          if ! [[ "$ad" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Senaryo adı yalnızca harf, rakam, - ve _ içerebilir: $ad"
            exit 1
          fi
          # Önce birebir, sonra büyük/küçük harf duyarsız eşleşme ara
          dosya=""
          if [ -f "senaryolar/$ad.json" ]; then
            dosya="senaryolar/$ad.json"
          else
            for f in senaryolar/*; do
              [ -f "$f" ] || continue
              taban="$(basename "$f")"
              if [ "${taban,,}" = "${ad,,}.json" ]; then dosya="$f"; break; fi
            done
          fi
          if [ -z "$dosya" ]; then
            echo "::error::senaryolar/$ad.json bulunamadı"
            exit 1
          fi
          taban="$(basename "$dosya")"
          echo "SENARYO_DOSYA=$dosya" >> "$GITHUB_ENV"
          echo "SENARYO_AD=${taban%.*}" >> "$GITHUB_ENV"
          echo "Senaryo: $dosya"

      - name: Videoyu üret
        env:
          # Pixabay asıl kaynak, Pexels isteğe bağlı. İkisi de yoksa video
          # renkli hareketli arka planla yine üretilir.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SES: ${{ inputs.ses }}
        run: |
          python scripts/uret.py \
            --senaryo "$SENARYO_DOSYA" \
            --ses "$SES" \
            --cikti cikti \
            --calisma calisma

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ env.SENARYO_AD }}-${{ github.run_number }}
          path: cikti/
          retention-days: 7

      - name: Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiket="video-${GITHUB_RUN_NUMBER}-${SENARYO_AD}"
          gh release create "$etiket" \
            cikti/video.mp4 \
            cikti/youtube-bilgileri.txt \
            --target "$GITHUB_SHA" \
            --title "${SENARYO_AD} (#${GITHUB_RUN_NUMBER})" \
            --notes-file cikti/youtube-bilgileri.txt
          echo "### Hazır 🎬" >> "$GITHUB_STEP_SUMMARY"
          echo "İndir: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${etiket}" >> "$GITHUB_STEP_SUMMARY"
